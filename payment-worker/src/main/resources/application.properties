spring.application.name=payment-worker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flashsale}
spring.datasource.username=${DB_USER:flashsale}
spring.datasource.password=${DB_PASSWORD:flashsale}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=3

# Simulated charge: a random delay, then declined with this probability.
payment.decline-rate=${DECLINE_RATE:0.1}
payment.min-delay-ms=${PAYMENT_MIN_DELAY_MS:50}
payment.max-delay-ms=${PAYMENT_MAX_DELAY_MS:300}

# Fault injection for failure testing: stop the JVM right after a payment row is written,
# before payment.result is published and before the Kafka offset is committed.
payment.halt-after-record=${HALT_AFTER_RECORD:false}
