spring.application.name=order-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flashsale}
spring.datasource.username=${DB_USER:flashsale}
spring.datasource.password=${DB_PASSWORD:flashsale}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Stock strategy: NAIVE, PESSIMISTIC, ATOMIC or OPTIMISTIC
flashsale.stock.strategy=${STOCK_STRATEGY:ATOMIC}

# When true, POST /orders needs a reservationId from POST /reservations.
# When false, POST /orders takes a productId and goes straight to Postgres.
flashsale.reservations.enabled=${RESERVATIONS_ENABLED:true}
flashsale.reservations.hold=${RESERVATION_HOLD:5m}
flashsale.reservations.sweep-interval-ms=1000
