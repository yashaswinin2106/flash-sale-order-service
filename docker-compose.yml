services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: flashsale
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d flashsale"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  order-service:
    build: ./order-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flashsale
      DB_USER: flashsale
      DB_PASSWORD: flashsale
      REDIS_HOST: redis
      STOCK_STRATEGY: ${STOCK_STRATEGY:-ATOMIC}
      RESERVATIONS_ENABLED: ${RESERVATIONS_ENABLED:-true}
      RESERVATION_HOLD: ${RESERVATION_HOLD:-5m}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
