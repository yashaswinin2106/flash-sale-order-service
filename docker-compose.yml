services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: flashsale
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d flashsale"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The services create their topics with 3 partitions on startup.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  order-service:
    build: ./order-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flashsale
      DB_USER: flashsale
      DB_PASSWORD: flashsale
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STOCK_STRATEGY: ${STOCK_STRATEGY:-ATOMIC}
      RESERVATIONS_ENABLED: ${RESERVATIONS_ENABLED:-true}
      RESERVATION_HOLD: ${RESERVATION_HOLD:-5m}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-worker:
    build: ./payment-worker
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flashsale
      DB_USER: flashsale
      DB_PASSWORD: flashsale
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DECLINE_RATE: ${DECLINE_RATE:-0.1}
      HALT_AFTER_RECORD: ${HALT_AFTER_RECORD:-false}
    depends_on:
      kafka:
        condition: service_healthy
      # The order service runs the Flyway migrations that create the payments table.
      order-service:
        condition: service_started

volumes:
  pgdata:
